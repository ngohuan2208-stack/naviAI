# NaviAI - CodeMagic iOS build configuration.
#
# Everything runs on CodeMagic's cloud macOS machines. There is NO need for a
# local Mac or Xcode: push to GitHub, start the workflow, download the .ipa
# artifact, sideload it onto your iPhone.
#
# NaviAI.xcodeproj and NaviAI/Info.plist are COMMITTED to Git, so CodeMagic's
# auto-detection recognizes this as an iOS application and xcodebuild can build
# it directly - no project generation step is required.
#
# Two workflows:
#   1) ios-unsigned  -> always builds. Produces an UNSIGNED .ipa that you can
#      re-sign and sideload yourself with Sideloadly / AltStore / your Apple
#      ID (no Apple developer account required, but 7-day expiry applies).
#   2) ios-signed    -> uses CodeMagic iOS code-signing. Set up your
#      certificate + provisioning profile in the CodeMagic UI (see README).
#      Produces a properly signed .ipa ready to install on registered devices.
#
# No signing secrets, certificates or private keys are stored in Git.

workflows:
  ios-unsigned:
    name: NaviAI - iOS (unsigned IPA)
    max_build_duration: 45
    instance_type: mac_mini_m2

    # Without a triggering block CodeMagic never starts builds automatically;
    # every push to main now queues a build. ios-signed stays manual-only on
    # purpose: it needs a certificate + profile attached in the CodeMagic UI.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      # 'latest' always maps to an available Xcode on CodeMagic. To pin, replace
      # with a specific version that CodeMagic offers, e.g. xcode: 16.0
      xcode: latest
      vars:
        XCODE_PROJECT: "NaviAI.xcodeproj"
        XCODE_SCHEME: "NaviAI"

    scripts:
      - name: Show detected project & scheme
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "Working dir: $(pwd)"
          ls -la NaviAI.xcodeproj
          xcodebuild -project "$XCODE_PROJECT" -list

      - name: Archive (no code signing) and package an unsigned .ipa
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          rm -rf build
          # Build a generic iOS device archive. The project uses
          # CODE_SIGN_STYLE = Automatic with NO development team set, so a bare
          # "xcodebuild archive" for iphoneos fails with the classic
          # 'Signing for "NaviAI" requires a development team' error (exit 65).
          # Here we explicitly switch to Manual signing and fully disable it so
          # the archive step never runs the automatic-signing/team validation.
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/NaviAI.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

          # xcodebuild -exportArchive cannot re-sign an unsigned archive, so we
          # package the .app into an .ipa manually. The result has no signature
          # and can be re-signed offline with Sideloadly / AltSign using your
          # own (free or paid) Apple ID.
          mkdir -p build/ipa/Payload
          cp -R build/NaviAI.xcarchive/Products/Applications/NaviAI.app build/ipa/Payload/
          cd build/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload NaviAI-unsigned.ipa
          cd "$CM_BUILD_DIR"
          echo "Unsigned IPA ready: build/ipa/NaviAI-unsigned.ipa"

    artifacts:
      - build/ipa/*.ipa
      - build/NaviAI.xcarchive/**/*.dSYM

  ios-signed:
    name: NaviAI - iOS (signed IPA, via CodeMagic signing)
    max_build_duration: 45
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      ios_signing:
        # CodeMagic rewrites signing settings automatically using the
        # Certificate & Profile you attach in the CodeMagic UI. Nothing here is
        # stored in Git.
        distribution_type: development
        bundle_identifier: com.naviai.app
      vars:
        XCODE_PROJECT: "NaviAI.xcodeproj"
        XCODE_SCHEME: "NaviAI"

    scripts:
      - name: Show detected project & scheme
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "Working dir: $(pwd)"
          ls -la NaviAI.xcodeproj
          xcodebuild -project "$XCODE_PROJECT" -list

      - name: Archive and export signed .ipa
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          rm -rf build
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/NaviAI.xcarchive \
            -allowProvisioningUpdates \
            archive
          # Write the export options to a file (portable, no shell subshells/heredocs).
          mkdir -p build
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>uploadBitcode</key>
              <false/>
          </dict>
          </plist>
          ' > build/exportOptions.plist
          xcodebuild \
            -exportArchive \
            -archivePath build/NaviAI.xcarchive \
            -exportOptionsPlist build/exportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates
          echo "Signed IPA ready: build/ipa/*.ipa"

    artifacts:
      - build/ipa/*.ipa
      - build/NaviAI.xcarchive/**/*.dSYM
