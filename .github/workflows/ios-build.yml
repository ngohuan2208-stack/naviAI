name: iOS Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: xcodebuild (unsigned, simulator SDK)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphonesimulator|iphoneos' || true

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project NaviAI.xcodeproj \
            -scheme NaviAI \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            build 2>&1 | tee build.log | xcpretty

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
