name: iOS Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-syntax:
    name: Linux Swift syntax check (no IPA)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check all Swift sources
        run: |
          chmod +x Scripts/syntax_check.sh
          Scripts/syntax_check.sh

  build:
    name: xcodebuild (unsigned, simulator SDK)
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphonesimulator|iphoneos' || true

      - name: Build (unsigned, iOS device)
        run: |
          set -o pipefail
          xcodebuild -project NaviAI.xcodeproj \
            -scheme NaviAI \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log | xcpretty

      - name: Package unsigned IPA
        run: |
          APP=$(find build/DerivedData/Build/Products -type d -name '*.app' | head -1)
          echo "Found app bundle: $APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry ../NaviAI-unsigned.ipa Payload
          cd ../..
          ls -lh build/NaviAI-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NaviAI-unsigned-ipa
          path: build/NaviAI-unsigned.ipa
          if-no-files-found: error

      - name: Publish raw IPA to GitHub Releases (no zip wrapper)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-latest"
          NOTES="Unsigned IPA built from commit ${GITHUB_SHA::7}.
          Tải file NaviAI-unsigned.ipa trực tiếp (không bọc zip).
          Lưu ý: file chưa ký — ký lại bằng Sideloadly/AltStore hoặc chứng chỉ Apple trước khi cài lên thiết bị."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" build/NaviAI-unsigned.ipa --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "NaviAI unsigned build (${GITHUB_SHA::7})" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" build/NaviAI-unsigned.ipa \
              --title "NaviAI unsigned build (${GITHUB_SHA::7})" \
              --notes "$NOTES" \
              --repo "$GITHUB_REPOSITORY"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) — \(.size) bytes"'

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
